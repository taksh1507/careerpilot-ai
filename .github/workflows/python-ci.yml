name: Python CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      JOBCARE_REQUIRE_REAL_MODEL_TEST: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install project and test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Cache the documented public embedding model
        run: python -c 'from huggingface_hub import snapshot_download; snapshot_download("sentence-transformers/all-MiniLM-L6-v2")'
      - name: Compile application modules
        run: python -m compileall -q adapters api cli filters matching models resume storage verification
      - name: Run unit and FastAPI integration tests
        run: python -m pytest -q
